# PostgreSQL 18 - Node 2 (pg2)
# Active-Active bidirectional logical replication

listen_addresses = '*'
port = 5432

# Replication
wal_level = logical
max_replication_slots = 10
max_wal_senders = 10

# Logical replication worker settings
max_logical_replication_workers = 10
max_worker_processes = 20

# Connection
max_connections = 200

# Logging
log_destination = 'stderr'
logging_collector = off
log_min_messages = warning
log_min_error_statement = error
log_line_prefix = '[pg2] %t [%p]: [%l-1] user=%u,db=%u,app=%a,client=%h '

# Performance tuning (light, for dev)
shared_buffers = 128MB
effective_cache_size = 512MB
maintenance_work_mem = 64MB
