services:
  pg1:
    image: postgres:18
    container_name: pg1
    # restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      REPLICATOR_PASSWORD: ${REPLICATOR_PASSWORD}
      APP_DB: ${APP_DB}
    ports:
      - "5432:5432"
    volumes:
      - ./data/pg1:/var/lib/postgresql
      - ./config/pg1/postgresql.conf:/etc/postgresql/postgresql.conf:ro
      - ./config/pg1/pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
      - ./scripts/init-pg1.sh:/docker-entrypoint-initdb.d/init-pg1.sh:ro
    command: >
      postgres
        -c config_file=/etc/postgresql/postgresql.conf
        -c hba_file=/etc/postgresql/pg_hba.conf
    networks:
      - pgnet
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${APP_DB}" ]
      interval: 5s
      timeout: 5s
      retries: 10

  pg2:
    image: postgres:18
    container_name: pg2
    # restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      REPLICATOR_PASSWORD: ${REPLICATOR_PASSWORD}
      APP_DB: ${APP_DB}
    ports:
      - "5433:5432"
    volumes:
      - ./data/pg2:/var/lib/postgresql
      - ./config/pg2/postgresql.conf:/etc/postgresql/postgresql.conf:ro
      - ./config/pg2/pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
      - ./scripts/init-pg2.sh:/docker-entrypoint-initdb.d/init-pg2.sh:ro
    command: >
      postgres
        -c config_file=/etc/postgresql/postgresql.conf
        -c hba_file=/etc/postgresql/pg_hba.conf
    networks:
      - pgnet
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${APP_DB}" ]
      interval: 5s
      timeout: 5s
      retries: 10

networks:
  pgnet:
    driver: bridge
